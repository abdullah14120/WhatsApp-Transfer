name: Build WhatsApp Transfer APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    name: Native Build & Assembly
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # ⚙️ 1. Core Logic: Environment & Toolchains
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ==========================================
      # 🚀 2. Core Logic: Build Engine
      # ==========================================
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --build-cache --parallel --no-daemon

      # ==========================================
      # 📦 3. UI / Presentation: Artifact Distribution
      # ==========================================
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Transfer-Build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 5
