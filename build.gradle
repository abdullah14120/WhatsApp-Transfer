// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // إضافة دعم لـ Navigation Safe Args إذا قررت استخدامه مستقبلاً
        // classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.7.7"
    }
}

plugins {
    // إصدار Android Gradle Plugin المستقر
    // ملاحظة: إذا كان أندرويد ستوديو لديك محدثاً لآخر إصدار، يمكنك رفع الرقم إلى '8.4.0' للحصول على أداء أفضل مع SDK 35
    id 'com.android.application' version '8.2.0' apply false
    id 'com.android.library' version '8.2.0' apply false
    
    // استخدام إصدار Kotlin 2.1.0 لضمان أداء أسرع وتوافق مع أندرويد 15
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
    
    // 🚀 إضافة بلجن Parcelize لإدارة إصداره مركزياً (مهم جداً لتسريع نقل البيانات بين الشاشات)
    id 'org.jetbrains.kotlin.plugin.parcelize' version '2.1.0' apply false
    
    // إضافة KAPT لتمكين مكتبات Room و Glide من توليد الكود برمجياً
    id 'org.jetbrains.kotlin.kapt' version '2.1.0' apply false
    
    // إضافة بلجن خدمات جوجل للفايربيس هنا مع جعل apply false 
    id 'com.google.gms.google-services' version '4.4.2' apply false
}

tasks.register('clean', Delete) {
    // 🛠️ إصلاح التحذير: استخدام layout.buildDirectory بدلاً من buildDir المتهالك في Gradle 8+
    delete rootProject.layout.buildDirectory
}
